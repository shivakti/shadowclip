services:
  api:
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
    volumes:
      - ./app:/app
    environment:
      - MODULE_NAME=main
      - VARIABLE_NAME=app
    ports:
      - "8000:80"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=shadow
      - POSTGRES_PASSWORD=shadow
      - POSTGRES_DB=clips
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  dbdata:

